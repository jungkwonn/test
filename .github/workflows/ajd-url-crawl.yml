name: AJD basic-tip URL crawl

on:
  push:
    branches:
      - ajd-url-crawl-20260901
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Collect sitemap and API URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ajd-output
          python3 - <<'PY'
          from __future__ import annotations

          import csv
          import gzip
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          OUT = Path('ajd-output')
          SITEMAP = 'https://www.ajd.co.kr/sitemap-honeytips.xml.gz'
          API = 'https://api-platform.ajd.co.kr/boards/honey-tips/contents'
          UA = 'Mozilla/5.0 (compatible; AJD-public-url-audit/1.0)'

          def get_bytes(url: str, attempts: int = 6, timeout: int = 30) -> bytes:
              last = None
              for attempt in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': '*/*'})
                      with urllib.request.urlopen(req, timeout=timeout) as resp:
                          return resp.read()
                  except Exception as exc:
                      last = exc
                      time.sleep(min(8, 0.7 * (2 ** attempt)))
              raise RuntimeError(f'GET failed after {attempts} attempts: {url}: {last!r}')

          def make_url(title: str, sn: int) -> str:
              slug = re.sub(r'\s+', '_', title.strip())
              encoded = urllib.parse.quote(slug, safe='-_.~')
              return f'https://www.ajd.co.kr/contents/basic-tip/detail/{encoded}-{sn}'

          records: dict[int, dict] = {}
          sitemap_error = ''
          try:
              raw = get_bytes(SITEMAP)
              if raw[:2] == b'\x1f\x8b':
                  raw = gzip.decompress(raw)
              root = ET.fromstring(raw)
              for el in root.iter():
                  if not el.tag.endswith('loc') or not el.text:
                      continue
                  url = el.text.strip()
                  if '/contents/basic-tip/detail/' not in url:
                      continue
                  match = re.search(r'-(\d+)(?:[?#].*)?$', url)
                  if not match:
                      continue
                  sn = int(match.group(1))
                  tail = urllib.parse.unquote(urllib.parse.urlsplit(url).path.rsplit('/', 1)[-1])
                  slug = re.sub(r'-\d+$', '', tail)
                  records[sn] = {
                      'content_id': sn,
                      'title': slug.replace('_', ' '),
                      'url': url,
                      'source': 'sitemap',
                      'is_hidden': '',
                      'created_datetime': '',
                      'categories': '',
                      'read_count': '',
                  }
          except Exception as exc:
              sitemap_error = repr(exc)

          first_url = API + '?' + urllib.parse.urlencode({
              'page': 0,
              'size': 8,
              'sort': 'createdDateTime',
              'includeHidden': 'true',
          })
          first = json.loads(get_bytes(first_url).decode('utf-8'))
          expected = int(first.get('totalElements') or 0)
          total_pages = int(first.get('totalPages') or 0)
          page_size = int(first.get('size') or 8)
          api_pages_fetched = 0
          api_failures: list[dict] = []

          def absorb(item: dict) -> None:
              sn = int(item['sn'])
              cats = ' > '.join(
                  str(c.get('categoryName', '')).strip()
                  for c in (item.get('categories') or [])
                  if str(c.get('categoryName', '')).strip()
              )
              existing = records.get(sn, {})
              url = existing.get('url') or make_url(str(item.get('title') or ''), sn)
              src = existing.get('source', '')
              records[sn] = {
                  'content_id': sn,
                  'title': str(item.get('title') or existing.get('title') or '').strip(),
                  'url': url,
                  'source': 'sitemap+api' if src == 'sitemap' else 'api',
                  'is_hidden': item.get('isHidden', ''),
                  'created_datetime': item.get('createdDateTime', ''),
                  'categories': cats,
                  'read_count': item.get('readCount', ''),
              }

          for item in first.get('content') or []:
              absorb(item)

          # Fetch every API page to prove completeness and enrich the sitemap URLs.
          def fetch_page(page: int) -> tuple[int, dict]:
              url = API + '?' + urllib.parse.urlencode({
                  'page': page,
                  'size': 8,
                  'sort': 'createdDateTime',
                  'includeHidden': 'true',
              })
              return page, json.loads(get_bytes(url).decode('utf-8'))

          pages = list(range(1, total_pages))
          with ThreadPoolExecutor(max_workers=12) as pool:
              futures = {pool.submit(fetch_page, p): p for p in pages}
              for fut in as_completed(futures):
                  page = futures[fut]
                  try:
                      _, payload = fut.result()
                      api_pages_fetched += 1
                      for item in payload.get('content') or []:
                          absorb(item)
                  except Exception as exc:
                      api_failures.append({'page': page, 'error': repr(exc)})

          # Retry failed pages serially with longer timeouts.
          if api_failures:
              retry_pages = [x['page'] for x in api_failures]
              api_failures = []
              for page in retry_pages:
                  try:
                      _, payload = fetch_page(page)
                      api_pages_fetched += 1
                      for item in payload.get('content') or []:
                          absorb(item)
                  except Exception as exc:
                      api_failures.append({'page': page, 'error': repr(exc)})

          ordered = sorted(records.values(), key=lambda r: int(r['content_id']), reverse=True)
          csv_path = OUT / 'AJD_basic-tip_all_urls.csv'
          with csv_path.open('w', encoding='utf-8-sig', newline='') as fh:
              writer = csv.DictWriter(fh, fieldnames=[
                  'content_id', 'title', 'url', 'source', 'is_hidden',
                  'created_datetime', 'categories', 'read_count'
              ])
              writer.writeheader()
              writer.writerows(ordered)

          txt_path = OUT / 'AJD_basic-tip_urls_only.txt'
          txt_path.write_text('\n'.join(r['url'] for r in ordered) + '\n', encoding='utf-8')

          unique_urls = len({r['url'] for r in ordered})
          summary = {
              'collected_at_utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'api_total_elements': expected,
              'api_total_pages': total_pages,
              'api_page_size': page_size,
              'api_pages_successfully_fetched_excluding_page_0': api_pages_fetched,
              'api_failed_pages': api_failures,
              'sitemap_error': sitemap_error,
              'unique_content_ids': len(ordered),
              'unique_urls': unique_urls,
              'min_content_id': min((r['content_id'] for r in ordered), default=None),
              'max_content_id': max((r['content_id'] for r in ordered), default=None),
              'hidden_true': sum(1 for r in ordered if r['is_hidden'] is True),
              'hidden_false': sum(1 for r in ordered if r['is_hidden'] is False),
          }
          (OUT / 'AJD_basic-tip_summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))

          if api_failures:
              raise SystemExit(f'API page failures remain: {len(api_failures)}')
          if expected and len(ordered) != expected:
              raise SystemExit(f'Count mismatch: collected={len(ordered)} expected={expected}')
          if unique_urls != len(ordered):
              raise SystemExit(f'Duplicate URLs: unique={unique_urls} rows={len(ordered)}')
          PY

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ajd-basic-tip-all-urls
          path: ajd-output/
          if-no-files-found: error
          retention-days: 3
